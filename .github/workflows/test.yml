name: Optional self-hosted Mac validation

on:
  workflow_dispatch:

concurrency:
  group: modbus-v8-manual-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  quality:
    runs-on: [self-hosted, macOS, ARM64, automatrix-ci, automatrix-mac]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run lint
      - run: npm run check:v8
      - run: npm run benchmark:v8
      - run: node scripts/benchmark-v7.js --cycles 25000 --min-fps 500 --max-heap-mb 384
      - run: npm run audit:runtime

  test:
    runs-on: [self-hosted, macOS, ARM64, automatrix-ci, automatrix-mac]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run check:v8
      - run: node --check src/index-v8.js
      - run: node --check src/index-v7.js
      - run: node --check desktop/main.js
      - run: node --check desktop/storage.js
      - run: node --check scripts/smoke.js
      - run: node --check scripts/acceptance.js
      - run: node --check scripts/version-sync.js
      - run: node --check scripts/check-v8-syntax.js
      - run: node --check scripts/benchmark-v8.js
      - run: node --check scripts/soak-v8.js
      - run: node --check playwright.config.js
      - run: npm test
      - run: npm run smoke
      - run: npm run acceptance

  browser-e2e:
    runs-on: [self-hosted, macOS, ARM64, automatrix-ci, automatrix-mac]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run e2e
