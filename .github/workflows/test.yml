name: Node tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: node --check src/index-v4.js
      - run: node --check src/advancedRuntimeState.js
      - run: node --check src/advancedWebServer.js
      - run: node --check src/dataTypeAnalyzer.js
      - run: node --check src/replayController.js
      - run: node --check src/modbus/advancedTransactionTracker.js
      - run: node --check public/app-v4.js
      - run: npm test
