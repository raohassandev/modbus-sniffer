name: Build Windows desktop installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'public/**'
      - 'config/**'
      - 'package.json'
      - '.github/workflows/desktop-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --prefix desktop install
      - run: npm --prefix desktop run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: modbus-engineering-analyzer-windows
          path: desktop/dist/*
