name: Generate npm lockfiles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-lockfiles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate root lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate desktop lockfile
        run: npm --prefix desktop install --package-lock-only --ignore-scripts
      - name: Commit lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json desktop/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi
          git commit -m "Add reproducible npm lockfiles"
          git push origin HEAD:main
